  projects:
    - title: "FORGE: Procedural Weight Generation for Sparse MoE Inference"
      tag: "ASPLOS 2027"
      bullets:
        - "Led the project and wrote the first-author paper."
        - "Designed the Rotor Generation Unit (RGU), an on-SM accelerator that regenerates MoE expert weights on the fly; exposed three axes of data parallelism in the generation algorithm and mapped them onto the datapath."
        - "Implemented and verified the RTL in SystemVerilog (cocotb, Verilator), synthesized it for area and timing, built a system-level simulator to project end-to-end speedup, and integrated the RGU into Accel-Sim for cycle-level GPU simulation."
    - title: "Fast Sandwich Products in Clifford Algebra"
      tag: "NeurIPS 2026"
      text: "Contributed a GPU kernel for the rotor sandwich product with bank-conflict-free shared-memory access, yielding up to 64× wall-clock and 35× memory improvements over existing implementations."
    - title: "3D Gaussian Splatting Rendering Acceleration"
      tag: "Ongoing"
      text: "Reproduced GEMM-GS (DAC 2026) as a baseline, profiled it on H100, and identified the sequential alpha-blending stage as the dominant remaining bottleneck. Prototyping parallelization of its dependency chain on tensor cores."
    - title: "Closed-Loop Neural-Machine Interface System Simulation"
      tag: "Ongoing"
      text: "Leading simulator development for a simulation-first BCI/exoskeleton co-design project. Modeled the sensorimotor loop as a multi-rate dependency graph under a sub-100 ms budget to identify architectural bottlenecks."
