    - title: "KV Cache Compression for Agentic LLM Serving"
      tag: "Senior Thesis"
      text: "Built a lossless GPU entropy codec (rANS) for SGLang's host-tier KV cache, fitting 1.4× more KV in the same DRAM. Combined with write-back, it cut mean TTFT 6× over SGLang's default (55 s to 9 s) on SWE-bench agent traces with 20 clients and scarce host memory."
