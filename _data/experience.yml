  advisor_url: "https://pages.cs.wisc.edu/~karu/"
  projects:
    - title: "FORGE: Procedural Weight Generation for Sparse MoE Inference"
      tag: "ASPLOS 2027"
      bullets:
        - "Project lead and first author."
        - "Designed the Rotor Generation Unit (RGU), an on-SM accelerator that regenerates MoE expert weights from compact seeds to remove HBM weight traffic, raising system throughput 1.3–2.8× and cutting parameter memory 28–29% at about 0.9% GPU SM area (7 nm)."
        - "Exposed three axes of data parallelism in the generation algorithm and mapped them onto the RGU datapath; implemented and verified the RTL in SystemVerilog (cocotb, Verilator) and synthesized it for area and timing."
        - "Built a system-level simulator to project end-to-end speedup, and later integrated the RGU into Accel-Sim for cycle-level GPU simulation."
    - title: "Fast Sandwich Products in Clifford Algebra"
      tag: "NeurIPS 2026"
      text: "Contributed to the GPU kernel for the rotor sandwich product with bank-conflict-free shared-memory access, enabling larger rotor-based layers with up to 64× wall-clock and 35× memory improvements over prior implementations."
    - title: "Closed-Loop Neural-Machine Interface System Simulation"
      tag: "Ongoing"
      text: "Leading simulator development for a simulation-first BCI/exoskeleton co-design project. Modeled the sensorimotor loop as a multi-rate dependency graph under a sub-100 ms budget to identify architectural bottlenecks."
    - title: "3D Gaussian Splatting Rendering Acceleration"
      tag: "Ongoing"
      text: "Profiled GEMM-GS (DAC 2026) on H100. Showed that naive INT8 tensor-core quantization collapses PSNR (25.5 → 17.3) for only a 1.36× speedup, and identified true inter-Gaussian dependencies in alpha blending as the fundamental limit to further parallelization."
